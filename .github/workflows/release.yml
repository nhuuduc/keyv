name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.3, without leading v)"
        required: false
        default: "0.3.3"
      publish_release:
        description: "Publish to GitHub Releases (creates tag v<version> if triggered manually)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign & Publish KeyV macOS Release
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            PUBLISH="true"
          else
            RAW="${{ inputs.version || '0.3.3' }}"
            VERSION="${RAW#v}"
            TAG="v${VERSION}"
            PUBLISH="${{ inputs.publish_release }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Rust test suite
        run: cargo test --workspace

      - name: Import persistent code-signing certificate (if configured)
        id: signing
        env:
          CERT_P12_B64: ${{ secrets.KEYV_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.KEYV_CERT_PASSWORD }}
          EXPLICIT_IDENTITY: ${{ secrets.KEYV_SIGNING_IDENTITY }}
        run: |
          if [ -n "$CERT_P12_B64" ] && [ -n "$CERT_PASS" ]; then
            RUNNER_KEYCHAIN="$RUNNER_TEMP/keyv-ci-signing.keychain-db"
            KEYCHAIN_PWD="$(openssl rand -hex 20)"
            CERT_FILE="$RUNNER_TEMP/signing.p12"

            echo "$CERT_P12_B64" | base64 --decode > "$CERT_FILE"
            security create-keychain -p "$KEYCHAIN_PWD" "$RUNNER_KEYCHAIN"
            security set-keychain-settings -lut 21600 "$RUNNER_KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$RUNNER_KEYCHAIN"

            EXISTING_KCS="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
            security list-keychains -d user -s $EXISTING_KCS "$RUNNER_KEYCHAIN"

            security import "$CERT_FILE" \
              -k "$RUNNER_KEYCHAIN" \
              -P "$CERT_PASS" \
              -T /usr/bin/codesign \
              -T /usr/bin/security

            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PWD" \
              "$RUNNER_KEYCHAIN"

            rm -f "$CERT_FILE"

            if [ -n "$EXPLICIT_IDENTITY" ]; then
              IDENTITY="$EXPLICIT_IDENTITY"
            else
              DEV_ID="$(security find-identity -v -p codesigning "$RUNNER_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
              if [ -n "$DEV_ID" ]; then
                IDENTITY="$DEV_ID"
              else
                IDENTITY="$(security find-identity -p codesigning "$RUNNER_KEYCHAIN" | sed -n 's/^[[:space:]]*[0-9][0-9]*)[[:space:]]*\([0-9A-F]\{40\}\)[[:space:]].*/\1/p' | head -n 1)"
              fi
            fi

            echo "keychain=$RUNNER_KEYCHAIN" >> "$GITHUB_OUTPUT"
            echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
            echo "Using imported signing identity: $IDENTITY"
          else
            echo "keychain=" >> "$GITHUB_OUTPUT"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "No KEYV_CERT_P12_BASE64 secret configured; building with deterministic ad-hoc identifier (app.keyv.host)."
          fi

      - name: Build & sign universal KeyV.app
        env:
          KEYV_UNIVERSAL: "1"
          KEYV_VERSION: ${{ steps.meta.outputs.version }}
          KEYV_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYV_KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain }}
        run: ./scripts/build.sh

      - name: Package .zip, .dmg & SHA256SUMS.txt
        env:
          KEYV_VERSION: ${{ steps.meta.outputs.version }}
          KEYV_ARCH_LABEL: macos-universal
        run: ./scripts/package_release.sh dist

      - name: Notarize release artifacts (optional Developer ID)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [[ "$SIGNING_IDENTITY" == "Developer ID Application:"* ]] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            DMG="dist/KeyV-${VERSION}-macos-universal.dmg"
            ZIP="dist/KeyV-${VERSION}-macos-universal.zip"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "$DMG"
            xcrun stapler staple apps/keyv-app/KeyV.app
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent apps/keyv-app/KeyV.app "$ZIP"
            cp "$ZIP" dist/KeyV-macos.zip
            (cd dist && shasum -a 256 "KeyV-${VERSION}-macos-universal.zip" "KeyV-macos.zip" "KeyV-${VERSION}-macos-universal.dmg" > SHA256SUMS.txt)
          else
            echo "Skipping Apple notarization (Developer ID + APPLE_ID/APPLE_TEAM_ID/APPLE_APP_SPECIFIC_PASSWORD not set)."
          fi

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyV-${{ steps.meta.outputs.version }}-macos-universal
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: KeyV v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/KeyV-${{ steps.meta.outputs.version }}-macos-universal.zip
            dist/KeyV-macos.zip
            dist/KeyV-${{ steps.meta.outputs.version }}-macos-universal.dmg
            dist/SHA256SUMS.txt

      - name: Clean up temporary signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
